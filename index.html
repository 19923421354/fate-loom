<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>织机</title><style>:root{--bg:#0a0a0f;--s1:#14141c;--s2:#1c1c28;--s3:#282840;--t:#e8e8f0;--t2:#9898b0;--t3:#585870;--ac:#c9a96e;--a2:#a8884a;--ub:#253040;--ab:#141a24;--red:#e44;--gr:#4a8;--bd:#202030;--fs:14px}
.light{--bg:#f0f0f5;--s1:#fff;--s2:#f5f5fa;--s3:#e8e8f0;--t:#1a1a2e;--t2:#585870;--t3:#9898b0;--ub:#dde4ff;--ab:#eef0f8;--bd:#ddd}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--t);height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;font-size:var(--fs)}
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;position:relative}
.hdr{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--s1);border-bottom:1px solid var(--bd);z-index:10;flex-shrink:0}
.hdr-t{font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--ac),#e8c97a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:6px;min-width:0}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--t3);display:inline-block;transition:.3s;flex-shrink:0}
.status-dot.ok{background:var(--gr)}.status-dot.err{background:var(--red)}
.hdr-a{display:flex;gap:4px;flex-shrink:0}
.ib{width:34px;height:34px;border:none;border-radius:50%;background:0;color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.main{flex:1;overflow:hidden;position:relative}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
.pg.ac{opacity:1;pointer-events:auto}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 10px 4px;display:flex;flex-direction:column;gap:6px}
.date-sep{align-self:center;font-size:10px;color:var(--t3);background:var(--s2);padding:3px 10px;border-radius:10px;margin:6px 0}
.msg{display:flex;flex-direction:column;max-width:90%;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.u{align-self:flex-end}.msg.a{align-self:flex-start}
.msg.starred .msg-b{box-shadow:0 0 0 2px var(--ac)}
.msg-b{padding:9px 13px;border-radius:15px;font-size:var(--fs);line-height:1.55;word-break:break-word;white-space:pre-wrap;position:relative;user-select:text}
.msg.u .msg-b{background:var(--ub);border-bottom-right-radius:4px}
.msg.a .msg-b{background:var(--ab);border-bottom-left-radius:4px}
.msg-b code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px;font-size:.9em}
.msg-b pre{background:rgba(0,0,0,.3);padding:8px;border-radius:6px;overflow-x:auto;margin:4px 0;white-space:pre}
.msg-b pre code{background:none;padding:0}
.msg-b strong{color:var(--ac)}.msg-b em{color:var(--t2)}
.msg-b h1,.msg-b h2,.msg-b h3{color:var(--ac);margin:6px 0 3px;font-size:1.1em}
.msg-b a{color:var(--ac);text-decoration:underline}
.msg-b table{border-collapse:collapse;margin:4px 0;font-size:.9em;width:100%}
.msg-b th,.msg-b td{border:1px solid var(--bd);padding:4px 8px}
.msg-b th{background:var(--s2)}
.msg-m{font-size:10px;color:var(--t3);margin-top:2px;display:flex;gap:2px;padding:0 4px;align-items:center;flex-wrap:wrap}
.msg.u .msg-m{justify-content:flex-end}
.msg-m button{cursor:pointer;color:var(--t3);font-size:10px;background:0;border:none;font-family:inherit;padding:2px}
.msg-reacts{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap}
.msg-reacts span{padding:2px 7px;border-radius:10px;background:var(--s2);font-size:10px;cursor:pointer;border:1px solid var(--bd)}
.typing{display:flex;gap:3px;padding:8px 13px}
.typing span{width:6px;height:6px;background:var(--t3);border-radius:50%;animation:ty 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes ty{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.1)}}
.inp-a{padding:6px 10px 8px;background:var(--s1);border-top:1px solid var(--bd);display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
.inp-a textarea{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:18px;color:var(--t);padding:9px 14px;font-size:var(--fs);resize:none;outline:none;max-height:100px;min-height:38px;font-family:inherit;line-height:1.4}
.inp-count{font-size:9px;color:var(--t3);align-self:center;flex-shrink:0;padding-right:2px}
.sbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--a2);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sbtn:disabled{background:var(--s3);color:var(--t3)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);gap:10px;padding:32px;text-align:center}
.empty .ic{font-size:48px;opacity:.5}.empty p{font-size:13px}
.preset-bar{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:var(--s1);border-top:1px solid var(--bd);flex-shrink:0}
.preset-chip{flex-shrink:0;padding:6px 12px;border-radius:16px;font-size:11px;font-weight:500;border:1.5px solid var(--bd);background:var(--s2);color:var(--t2);cursor:pointer;white-space:nowrap}
.preset-chip.sel{border-color:var(--ac);color:var(--ac);background:rgba(201,169,110,.1)}
.preset-chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.quick-actions{display:flex;gap:4px;padding:4px 10px;background:var(--s1);flex-shrink:0;overflow-x:auto}
.qa-btn{flex-shrink:0;padding:4px 10px;border-radius:12px;font-size:10px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);cursor:pointer;font-family:inherit}
.conv-list{flex:1;overflow-y:auto;padding:6px}
.conv-search{padding:8px;display:flex;gap:6px}
.conv-search input{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--t);padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.citem{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--s1);border-radius:10px;margin-bottom:4px;cursor:pointer;border:1.5px solid transparent}
.citem.act{border-color:var(--a2);background:var(--s2)}
.citem.pinned{border-left:3px solid var(--ac)}
.citem.archived{opacity:.5}
.cinfo{flex:1;min-width:0}
.ctitle{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpreview{font-size:11px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctime{font-size:10px;color:var(--t3);flex-shrink:0;margin-left:4px}
.cdel{width:26px;height:26px;border:none;border-radius:50%;background:0;color:var(--t3);cursor:pointer;font-size:12px;flex-shrink:0;margin-left:2px}
.cadd{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:var(--s1);border:2px dashed var(--bd);border-radius:10px;color:var(--t2);cursor:pointer;font-size:13px;margin-bottom:4px}
.cactions{display:flex;gap:4px;padding:4px 6px;flex-wrap:wrap}
.sets{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.sg{background:var(--s1);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sg label{font-size:12px;font-weight:600;color:var(--t2)}
.sg input,.sg textarea,.sg select{background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--t);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;width:100%;resize:vertical}
.sg textarea{min-height:80px;font-size:12px;line-height:1.5}
.sg .hint{font-size:10px;color:var(--t3)}
.bnav{height:54px;padding-bottom:env(safe-area-inset-bottom,0);background:var(--s1);border-top:1px solid var(--bd);display:flex;z-index:10;flex-shrink:0}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:0;color:var(--t3);cursor:pointer;font-size:10px;font-family:inherit}
.nitem .ni{font-size:20px}.nitem.ac{color:var(--ac)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--s3);color:var(--t);padding:8px 18px;border-radius:18px;font-size:12px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1}
.modal-o{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-o.show{opacity:1;pointer-events:auto}
.modal{background:var(--s1);border-radius:14px;padding:18px;width:90%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:15px;color:var(--t)}
.modal input,.modal textarea,.modal select{background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--t);padding:9px 12px;font-size:13px;font-family:inherit;outline:none}
.modal-act{display:flex;gap:6px;justify-content:flex-end}
.menu-btn{width:100%;padding:12px;border:none;border-bottom:1px solid var(--bd);background:0;color:var(--t);font-size:14px;cursor:pointer;text-align:left;font-family:inherit;display:flex;align-items:center;gap:10px}
.menu-btn.danger{color:var(--red)}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-p{background:var(--a2);color:#fff}.btn-o{background:0;border:1px solid var(--bd);color:var(--t)}
.btn-d{background:0;border:1px solid var(--red);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pcard{background:var(--s2);border:1.5px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;text-align:center}
.pcard.sel{border-color:var(--ac);background:rgba(201,169,110,.08)}
.pcard .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.scene-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scard{background:var(--s2);border:1.5px solid var(--bd);border-radius:10px;padding:6px;cursor:pointer;text-align:center;font-size:10px}
.scard .se{font-size:18px;display:block;margin-bottom:2px}
.toggle{width:44px;height:24px;border-radius:12px;border:none;background:var(--s3);cursor:pointer;position:relative}
.toggle.on{background:var(--ac)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px}
.toggle.on::after{left:22px}
.search-bar{display:flex;gap:6px;padding:4px 10px;background:var(--s1);flex-shrink:0}
.search-bar input{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:16px;color:var(--t);padding:6px 12px;font-size:12px;font-family:inherit;outline:none}
.search-results{position:absolute;top:96px;left:0;right:0;bottom:0;background:var(--bg);z-index:5;overflow-y:auto;padding:10px;display:none}
.search-results.show{display:block}
.search-hit{background:rgba(201,169,110,.25);border-radius:2px}
.scroll-bottom{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:none;z-index:50}
.scroll-bottom.show{display:block}
.react-picker{display:flex;gap:4px;padding:6px 10px;background:var(--s2);border-radius:20px;border:1px solid var(--bd);flex-wrap:wrap}
.react-picker span{font-size:18px;cursor:pointer;padding:2px}
.select-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ac);color:#fff;flex-shrink:0;font-size:12px;display:none}
.select-bar.show{display:flex}
.welcome{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s;opacity:0;pointer-events:none}
.welcome.show{opacity:1;pointer-events:auto}
.welcome .logo{font-size:64px}
.welcome h2{color:var(--ac);font-size:24px}
.welcome p{color:var(--t2);font-size:13px;max-width:280px;text-align:center;line-height:1.6}
.sponsor-banner{display:flex;align-items:center;gap:8px;padding:12px;background:linear-gradient(135deg,rgba(201,169,110,.15),rgba(201,169,110,.05));border:1px solid rgba(201,169,110,.4);border-radius:12px;cursor:pointer;margin-bottom:8px}
.sponsor-banner .s-ic{font-size:24px}
.sponsor-banner .s-tx{flex:1;font-size:12px;color:var(--t2)}
.sponsor-banner .s-tx b{color:var(--ac);font-size:13px}
.qr-tabs{display:flex;gap:6px;margin-bottom:8px}
.qr-tab{flex:1;padding:8px;border:1.5px solid var(--bd);border-radius:10px;background:var(--s2);color:var(--t2);font-size:13px;cursor:pointer;text-align:center;font-family:inherit}
.qr-tab.sel{border-color:var(--ac);color:var(--ac);background:rgba(201,169,110,.1)}
.qr-box{display:none;flex-direction:column;align-items:center;gap:8px;padding:12px;background:var(--s2);border-radius:12px}
.qr-box.show{display:flex}
.qr-box img{width:220px;height:220px;border-radius:8px;background:#fff;padding:6px;object-fit:contain}
.qr-box .qr-tip{font-size:11px;color:var(--t3);text-align:center;line-height:1.5}
.about-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}
.about-row:last-child{border-bottom:none}
.about-row .ar-l{color:var(--t2)}
.about-row .ar-r{color:var(--t);display:flex;align-items:center;gap:6px}
.about-row a{color:var(--ac);text-decoration:none}
.file-imp{display:none} .md-task{list-style:none;padding-left:4px;margin:4px 0}.md-task li{padding:2px 0}.md-task li::before{display:inline-block;width:14px;text-align:center}.md-task li.done{color:var(--t3);text-decoration:line-through}.md-task li.done::before{content:"✅"}.md-task li.todo::before{content:"⬜"}.md-quote{border-left:3px solid var(--ac);padding:4px 10px;margin:6px 0;background:var(--s2);color:var(--t2);border-radius:0 6px 6px 0}.msg-b img{max-width:100%;border-radius:8px;margin:4px 0}.msg-b pre{position:relative}.copy-code{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 8px;border-radius:6px;background:var(--s3);color:var(--t2);border:1px solid var(--bd);cursor:pointer;font-family:inherit;z-index:2}.conv-empty{padding:30px;text-align:center;color:var(--t3);font-size:12px}.sbtn.stop{background:var(--red)}
</style></head><body><div id="app">
<div class="hdr"><span class="hdr-t"><span class="status-dot" id="statusDot"></span><span class="ttl">🌌 织机 <span style="font-size:10px;color:var(--t3)">v1.4.1</span></span></span><div class="hdr-a"><button class="ib" id="btnSearch">🔍</button><button class="ib" id="btnTheme">🌓</button><button class="ib" id="btnClear">🗑️</button><button class="ib" id="btnRegen">🔄</button><button class="ib" id="btnExportChat">📋</button></div></div>
<div class="select-bar" id="selectBar"><span id="selCount">已选0条</span><button class="btn btn-sm" onclick="batchDelMsgs()">删除</button><button class="btn btn-sm" onclick="cancelSelect()">取消</button></div>
<div class="search-bar" id="searchBar" style="display:none"><input type="text" id="searchInp" placeholder="搜索消息..."><span id="searchCount" style="font-size:10px;color:var(--t3)"></span><button class="btn btn-sm btn-o" id="btnSearchClose">✕</button></div>
<div class="search-results" id="searchResults"></div>
<div class="main">
<div class="pg ac" id="pg-chat">
<div class="chat-msgs" id="msgs"></div>
<button class="scroll-bottom" id="btnScrollBottom">↓</button>
<div class="quick-actions" id="quickActions"></div>
<div class="preset-bar" id="presetBar"></div>
<div class="inp-a"><textarea id="chatInp" rows="1" placeholder="输入你的行动..."></textarea><span class="inp-count" id="inpCount"></span><button class="sbtn" id="btnSend">➤</button></div>
</div>
<div class="pg" id="pg-conv"><div class="conv-search"><input type="text" id="convSearchInp" placeholder="搜索会话..."><button class="btn btn-sm btn-p" onclick="newConv()">+新建</button></div><div class="conv-list" id="convList"></div></div>
<div class="pg" id="pg-sets"><div class="sets" id="setsContent"></div></div>
</div>
<div class="bnav"><button class="nitem ac" data-pg="chat"><span class="ni">💬</span>聊天</button><button class="nitem" data-pg="conv"><span class="ni">📚</span>会话<span id="convCount"></span></button><button class="nitem" data-pg="sets"><span class="ni">⚙️</span>设置</button></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-o" id="renameModal"><div class="modal"><h3>重命名</h3><input type="text" id="renameInp"><div class="modal-act"><button class="btn btn-o" id="btnCancelRename">取消</button><button class="btn btn-p" id="btnConfirmRename">确定</button></div></div></div>
<div class="modal-o" id="editModal"><div class="modal"><h3>编辑消息</h3><textarea id="editMsgInp"></textarea><div class="modal-act"><button class="btn btn-o" id="btnCancelEdit">取消</button><button class="btn btn-p" id="btnConfirmEdit">更新</button></div></div></div>
<div class="modal-o" id="branchModal"><div class="modal"><h3>从这里重新开始</h3><p style="font-size:13px;color:var(--t2)">将保留此消息之前的所有对话。</p><div class="modal-act"><button class="btn btn-o" id="btnCancelBranch">取消</button><button class="btn btn-p" id="btnConfirmBranch">确认</button></div></div></div>
<div class="modal-o" id="confirmModal"><div class="modal"><h3 id="confirmTitle">确认</h3><p id="confirmMsg" style="font-size:13px;color:var(--t2)"></p><div class="modal-act"><button class="btn btn-o" id="btnCancelConfirm">取消</button><button class="btn btn-p" id="btnConfirmOk">确定</button></div></div></div>
<div class="modal-o" id="msgMenuModal"><div class="modal" style="padding:0"><button class="menu-btn" id="mCopy">📋 复制</button><button class="menu-btn" id="mStar">⭐ 收藏/取消</button><button class="menu-btn" id="mReact">😀 添加反应</button><button class="menu-btn" id="mEdit">✏️ 编辑</button><button class="menu-btn" id="mBranch">🔀 从这里分支</button><button class="menu-btn" id="mSpeak">🔊 朗读</button><button class="menu-btn danger" id="mDel">🗑️ 删除</button></div></div>
<div class="modal-o" id="reactModal"><div class="modal"><h3>添加反应</h3><div class="react-picker" id="reactPicker"><span>👍</span><span>👎</span><span>❤️</span><span>😲</span><span>😂</span><span>😢</span><span>🔥</span><span>✅</span><span>💡</span><span>❓</span></div></div></div>

<script type="text/plain" id="defPrompt">你是命运织机沉浸式故事叙述系统。立刻开始一个场景，让一位性格鲜明、带有动机的NPC做出显著行动或率先发言，然后绝对静止等待玩家输入。回应正文不超过300字。玩家完全掌控所扮演角色，你禁止替玩家说话行动思考。输入/重置擦除全部信息生成新场景。输入。表示沉默，世界自主推进。你用（）记录的一切皆为不可动摇的真实。你拥有超群记忆，蝴蝶效应真实存在。每位NPC都是独立生命体。不存在预设终点。不存在真正意义上的失败。构建充满感官细节的世界。展示而非告知。现在开始。</script>
<script type="text/plain" id="sceneSciFi">你是织机星海科幻叙事系统。远未来太空站舷窗外星云缓缓飘动。神经机械改造过的船长盯着全息地图，警报声划破控制室。他转身看向来者。请NPC率先发言。</script>
<script type="text/plain" id="sceneWuxia">你是织机江湖武侠叙事系统。夕阳破败古庙前，斗笠剑客拔出三尺青锋。风吹过他刀锋般锐利的眼神。不远处黑衣人若隐若现。请剑客率先行动。</script>
<script type="text/plain" id="sceneFantasy">你是织机幻境奇幻叙事系统。精灵森林月光洒下银色斑点。暗色长袍法师站在藤蔓石门前，符文渐亮。远处巨龙咆哮。请法师率先行动。</script>
<script type="text/plain" id="sceneHorror">你是织机暗影悬疑叙事系统。雨季城市笼罩灰雾。老旧公寓走廊灯光闪烁。你手中案件搁置三年，新线索出现。敲门声——三声，停顿，又三声。请来者率先发言。</script>
<script type="text/plain" id="sceneRomance">你是织机花信古风言情叙事系统。江南春日细雨如丝。烟雨楼台上一位白衣女子凭栏而立，手中攥着一封泛黄的信笺，眼角似有泪痕。身后脚步声渐近，她慌忙拭去泪水转身。请NPC率先发言。</script>
<script type="text/plain" id="sceneNoir">你是织机迷雾黑色侦探叙事系统。1940年代上海滩雨夜。霓虹灯透过百叶窗在侦探事务所投下条纹阴影。桌上威士忌半空，烟灰缸里塞满烟蒂。电话突然响起，三声后挂断——这是约定好的暗号。请NPC率先行动。</script>

let S={apiUrl:'',apiKey:'',model:'',temp:0.7,maxTokens:2048,sysPrompt:'',convs:[],cid:null,page:'chat',gen:false,renId:null,editId:null,branchId:null,msgMenuIdx:null,convMenuId:null,presetIdx:6,theme:'dark',fontSize:14,autoScroll:true,enterSend:true,archiveFilter:false,searchMode:false,selMode:false,selSet:new Set(),tts:true,firstRun:true,confirmCb:null,msgReact:null,stopGen:false,typingEl:null};

function save(){try{localStorage.setItem('fw8',JSON.stringify({apiUrl:S.apiUrl,apiKey:S.apiKey,model:S.model,temp:S.temp,maxTokens:S.maxTokens,sysPrompt:S.sysPrompt,convs:S.convs,cid:S.cid,presetIdx:S.presetIdx,theme:S.theme,fontSize:S.fontSize,autoScroll:S.autoScroll,enterSend:S.enterSend,tts:S.tts,firstRun:S.firstRun}))}catch(e){toast('⚠️存储空间不足',3000)}}
function load(){const r=localStorage.getItem('fw8');if(r){try{const d=JSON.parse(r);Object.assign(S,d);S.temp=S.temp||0.7;S.maxTokens=S.maxTokens||2048;S.presetIdx=(S.presetIdx===undefined)?6:S.presetIdx;S.fontSize=S.fontSize||14;S.autoScroll=(S.autoScroll===undefined)?true:S.autoScroll;S.enterSend=(S.enterSend===undefined)?true:S.enterSend;S.theme=S.theme||'dark';S.tts=(S.tts===undefined)?true:S.tts;S.firstRun=(S.firstRun===undefined)?true:S.firstRun;S.selSet=new Set()}catch(e){}}if(!S.sysPrompt){const el=$('#defPrompt');if(el)S.sysPrompt=el.textContent.trim()}applyTheme()}
function gi(){return 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}
function ft(ts){const d=new Date(ts),n=new Date();const p=function(x){return String(x).padStart(2,'0')};if(d.toDateString()===n.toDateString())return '今天'+p(d.getHours())+':'+p(d.getMinutes());const y=new Date(n);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return '昨天'+p(d.getHours())+':'+p(d.getMinutes());return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function fd(ts){const d=new Date(ts),n=new Date();const y=new Date(n);y.setDate(y.getDate()-1);if(d.toDateString()===n.toDateString())return '今天';if(d.toDateString()===y.toDateString())return '昨天';return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function toast(m,t){t=t||1800;const e=$('#toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},t)}

function applyTheme(){if(S.theme==='light')document.body.classList.add('light');else document.body.classList.remove('light');document.body.style.setProperty('--fs',S.fontSize+'px');const b=$('#btnTheme');if(b)b.textContent=(S.theme==='light')?'☀️':'🌓'}
function toggleTheme(){S.theme=(S.theme==='dark')?'light':'dark';applyTheme();save();renderSets();toast(S.theme==='dark'?'深色':'浅色')}
function linkify(t){return t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>')}
function eh(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function mdRender(text){const blocks=[];let out=text;out=out.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,l,c){blocks.push('<pre><code>'+c.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</code></pre>');return '\x00'+(blocks.length-1)+'\x00'});out=out.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');out=out.replace(/\|(.+)\|/gm,function(m,row){if(row.indexOf('---')>=0)return '';const cells=row.split('|').map(function(c){return c.trim()}).filter(Boolean);if(cells.length>1)return '<tr>'+cells.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>';return ''});out=linkify(out);out=out.replace(/\n/g,'<br>');out=out.replace(/\x00(\d+)\x00/g,function(m,i){return blocks[i]});return out}

function renderMsgs(){const c=gc();const d=$('#msgs');if(!d)return;d.innerHTML='';if(!c||!c.msgs||c.msgs.length===0){d.innerHTML='<div class="empty"><span class="ic">🧵</span><p>织机已启动</p><button class="btn btn-p" onclick="navTo(\'sets\')">⚙️ 去设置配置API</button></div>';return}const f=document.createDocumentFragment();let lastDay='';c.msgs.forEach(function(m,i){const day=fd(m.ts||Date.now());if(day!==lastDay){lastDay=day;const ds=document.createElement('div');ds.className='date-sep';ds.textContent=day;f.appendChild(ds)}const e=document.createElement('div');e.className='msg '+(m.role==='user'?'u':'a')+(m.starred?' starred':'');e.innerHTML='<div class="msg-b">'+mdPost(mdRender(eh(m.content)))+'</div><div class="msg-m"><button onclick="msgMenu('+i+')">•••</button><span>'+ft(m.ts||Date.now())+'</span></div>'+(m.reactions&&Object.keys(m.reactions).length?'<div class="msg-reacts">'+Object.keys(m.reactions).map(function(r){return '<span onclick="reactMsg('+i+',\''+r+'\')">'+r+' '+m.reactions[r]+'</span>'}).join('')+'</div>':'');e.addEventListener('contextmenu',function(ev){ev.preventDefault();msgMenu(i)});let lt;e.addEventListener('touchstart',function(){lt=setTimeout(function(){msgMenu(i)},600)});e.addEventListener('touchend',function(){clearTimeout(lt)});e.addEventListener('touchmove',function(){clearTimeout(lt)});f.appendChild(e)});d.appendChild(f);if(S.autoScroll)scrollB();checkScroll()}
function msgMenu(i){S.msgMenuIdx=i;const c=gc();const m=c&&c.msgs[i];if(!m)return;$('#mCopy').onclick=function(){navigator.clipboard.writeText(m.content);toast('✅ 已复制')};$('#mStar').onclick=function(){m.starred=!m.starred;save();renderMsgs();toast(m.starred?'⭐ 已收藏':'已取消')};$('#mReact').onclick=function(){openModal('reactModal')};$('#mEdit').onclick=function(){S.editId=i;openModal('editModal');$('#editMsgInp').value=m.content};$('#mBranch').onclick=function(){S.branchId=i;openModal('branchModal')};$('#mSpeak').onclick=function(){if(S.tts){const u=new SpeechSynthesisUtterance(m.content);u.lang='zh-CN';speechSynthesis.speak(u);toast('🔊 朗读中')}};$('#mDel').onclick=function(){showConfirm('删除这条消息？',function(){c.msgs.splice(i,1);save();renderMsgs()});closeModal('msgMenuModal')};openModal('msgMenuModal')}

function aiCall(userMsg){S.gen=true;S.stopGen=false;S._retried=false;
S.abortCtl=(typeof AbortController!=='undefined')?new AbortController():null;
const btn=$('#btnSend');btn.disabled=false;btn.textContent='⏹';btn.classList.add('stop');const sd=$('#statusDot');sd.classList.remove('ok','err');sd.classList.add('err');

if(userMsg===''){msgs.push({role:'user',content:'（沉默）'})}
const payload={model:S.model,messages:[{role:'system',content:gsp()}].concat(msgs),temperature:S.temp,max_tokens:S.maxTokens,stream:true};
const tEl=showTyping();let acc='',newMsgId=null;
function appendChunk(txt){acc+=txt;if(!newMsgId){if(acc.length>0){hideTyping(tEl);const mid=gi();newMsgId=mid;c.msgs.push({id:mid,role:'ai',content:acc,ts:Date.now()});renderMsgs();scrollB()}}else{const mi=c.msgs.findIndex(function(m){return m.id===newMsgId});if(mi>=0){c.msgs[mi].content=acc;const els=$('#msgs').querySelectorAll('.msg');if(els[mi])els[mi].querySelector('.msg-b').innerHTML=mdPost(mdRender(eh(acc)));if(S.autoScroll)scrollB()}}}
function handleErr(err){hideTyping(tEl);if(err&&err.name==='AbortError'){if(!newMsgId){const mid=gi();newMsgId=mid;c.msgs.push({id:mid,role:'ai',content:'⏹ 已停止生成',ts:Date.now()})}else{const mi=c.msgs.findIndex(function(m){return m.id===newMsgId});if(mi>=0){c.msgs[mi].content+='\n\n⏹ 已停止生成'}}}else{if(!newMsgId){const mid=gi();newMsgId=mid;c.msgs.push({id:mid,role:'ai',content:'⚠️ 请求失败：'+err.message,ts:Date.now()})}else{const mi=c.msgs.findIndex(function(m){return m.id===newMsgId});if(mi>=0){c.msgs[mi].content+='\n\n⚠️ 请求中断：'+err.message}}}save();renderMsgs();finish()}
function doFetch(isStream){
payload.stream=isStream;
const opt={method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},body:JSON.stringify(payload)};
if(S.abortCtl)opt.signal=S.abortCtl.signal;
return fetch(S.apiUrl,opt).then(function(resp){
if(!resp.ok){return resp.text().then(function(txt){var em='HTTP '+resp.status;var raw='';try{var je=JSON.parse(txt);if(je&&je.error)raw=(je.error.message||je.error.type||JSON.stringify(je.error))}catch(e){raw=txt}if(raw&&raw.length<200)em+=' - '+raw;var low=raw.toLowerCase();if(low.indexOf('model')>=0&&(low.indexOf('not')>=0||low.indexOf('exist')>=0||low.indexOf('found')>=0)){em+='（模型名不存在，请在设置中检查模型名称，如 deepseek-v4-pro）'}else if(resp.status===401){em+='（API密钥无效，请检查密钥）'}else if(resp.status===403){em+='（无权限，请检查账户余额或权限）'}else if(resp.status===404){em+='（接口地址错误，请检查API地址是否以 /chat/completions 结尾）'}else if(resp.status===429){em+='（请求过于频繁，请稍后重试）'}else if(resp.status===400){em+='（请求参数错误，请检查模型名/API地址/密钥是否正确）'}throw new Error(em)})}
if(!isStream){return resp.json().then(function(j){const txt=j&&j.choices&&j.choices[0]&&(j.choices[0].message?j.choices[0].message.content:(j.choices[0].delta?j.choices[0].delta.content:''));if(txt)appendChunk(txt);finish()})}
if(!resp.body||!resp.body.getReader){return resp.json().then(function(j){const txt=j&&j.choices&&j.choices[0]&&(j.choices[0].message?j.choices[0].message.content:(j.choices[0].delta?j.choices[0].delta.content:''));if(txt)appendChunk(txt);finish()})}
const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
function pump(){return reader.read().then(function(r){
if(r.done){finish();return}
buf+=dec.decode(r.value,{stream:true});
let idx;while((idx=buf.indexOf('\n'))>=0){const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);if(line.indexOf('data:')===0){const data=line.slice(5).trim();if(data==='[DONE]'){finish();return}try{const j=JSON.parse(data);const delta=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(delta)appendChunk(delta)}catch(e){}}}
return pump()})}
return pump()});
}
try{
doFetch(true).catch(function(err){
if(err&&err.name!=='AbortError'&&!S._retried){S._retried=true;var low=(err.message||'').toLowerCase();if(low.indexOf('max_tokens')>=0||low.indexOf('max tokens')>=0){payload.max_tokens=undefined;hideTyping(tEl);toast('⚠️ 该API不支持max_tokens，已自动调整重试...',2500);return doFetch(true)}
hideTyping(tEl);toast('⚠️ 流式请求失败，改用非流式重试...',2000);return doFetch(false)}
handleErr(err);
}).catch(handleErr);
}catch(e){hideTyping(tEl);toast('❌ '+e.message);finish()}

function loadQr(){var a=document.getElementById('qrAliImg'),w=document.getElementById('qrWxImg');if(a&&!a.src)a.src=QR_ALI;if(w&&!w.src)w.src=QR_WX}
function openSponsor(){loadQr();openModal('sponsorModal')}
function switchPay(p){const ta=$('#tabAlipay'),tw=$('#tabWechat'),qa=$('#qrAlipay'),qw=$('#qrWechat');if(ta)ta.classList.toggle('sel',p==='alipay');if(tw)tw.classList.toggle('sel',p==='wechat');if(qa)qa.classList.toggle('show',p==='alipay');if(qw)qw.classList.toggle('show',p==='wechat')}
function feedback(){var u='https://github.com/'+REPO+'/issues';showConfirm('📮 反馈方式：点击确定前往 GitHub Issues（将自动复制链接）',function(){try{navigator.clipboard.writeText(u)}catch(e){}try{window.open(u,'_blank')}catch(e){}try{location.href=u}catch(e){};toast('📮 正在打开 Issues...')})}
function openSource(){var u='https://github.com/19923421354/fate-loom';showConfirm('🌐 开源仓库：'+u+'\n\n点击确定在浏览器中打开（或自动复制链接）',function(){try{navigator.clipboard.writeText(u)}catch(e){}try{window.open(u,'_blank')}catch(e){}try{location.href=u}catch(e){};toast('🌐 正在打开 GitHub...')})}
function init(){
load();applyTheme();renderPresets();renderQuickActions();renderMsgs();renderConvs();
if(S.firstRun){openModal('welcome');S.firstRun=false;save()}else{closeModal('welcome')}
const b1=$('#btnTheme');if(b1)b1.onclick=toggleTheme;
const b2=$('#btnSearch');if(b2)b2.onclick=toggleSearch;
const b3=$('#btnClear');if(b3)b3.onclick=function(){showConfirm('清空当前会话？',function(){const c=gc();if(c){c.msgs=[];save();renderMsgs()}})};
const b4=$('#btnRegen');if(b4)b4.onclick=regenLast;
const b5=$('#btnExportChat');if(b5)b5.onclick=exportChat;
const b6=$('#btnWelcome');if(b6)b6.onclick=function(){closeModal('welcome');navTo('sets')};
const b7=$('#btnSend');if(b7)b7.onclick=sendMsg;
const inp=$('#chatInp');if(inp){inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(S.enterSend)sendMsg()}};inp.oninput=function(){const t=inp.value;const c=$('#inpCount');if(c)c.textContent=t.length+'字';inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px'}}
const b8=$('#btnScrollBottom');if(b8)b8.onclick=scrollB;
const si=$('#searchInp');if(si)si.oninput=doSearch;
const b9=$('#btnSearchClose');if(b9)b9.onclick=toggleSearch;
const ri=$('#renameInp');if(ri)ri.onkeydown=function(e){if(e.key==='Enter')confirmRename()};
const b10=$('#btnConfirmRename');if(b10)b10.onclick=confirmRename;
const b11=$('#btnCancelRename');if(b11)b11.onclick=function(){closeModal('renameModal')};
const ei=$('#editMsgInp');if(ei)ei.onkeydown=function(e){if(e.key==='Enter')confirmEdit()};
const b12=$('#btnConfirmEdit');if(b12)b12.onclick=confirmEdit;
const b13=$('#btnCancelEdit');if(b13)b13.onclick=function(){closeModal('editModal')};
const b14=$('#btnConfirmBranch');if(b14)b14.onclick=function(){const c=gc();if(!c||S.branchId===null)return;const idx=S.branchId;if(idx<c.msgs.length){c.msgs=c.msgs.slice(0,idx);save();renderMsgs()}closeModal('branchModal')};
const b15=$('#btnCancelBranch');if(b15)b15.onclick=function(){closeModal('branchModal')};
const b16=$('#btnConfirmOk');if(b16)b16.onclick=function(){if(S.confirmCb)S.confirmCb();S.confirmCb=null;closeModal('confirmModal')};
const b17=$('#btnCancelConfirm');if(b17)b17.onclick=function(){S.confirmCb=null;closeModal('confirmModal')};
$$('#msgMenuModal .menu-btn').forEach(function(b){b.onclick=function(){closeModal('msgMenuModal')}});
$$('#reactPicker span').forEach(function(s){s.onclick=function(){const c=gc();if(c&&S.msgMenuIdx!==null)reactMsg(S.msgMenuIdx,s.textContent);closeModal('reactModal')}});

$$('.nitem').forEach(function(b){b.onclick=function(){navTo(b.dataset.pg)}});
const csi=$('#convSearchInp');if(csi){csi.oninput=function(){S.convQ=csi.value.trim();renderConvs()}}
const fip=$('#fileImport');if(fip){fip.onchange=function(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=function(){try{const d=JSON.parse(rd.result);if(!d||typeof d!=='object')throw 0;if(d.convs&&Array.isArray(d.convs)){S.convs=d.convs;S.cid=d.cid||null;S.apiUrl=d.apiUrl||S.apiUrl;S.apiKey=d.apiKey||S.apiKey;S.model=d.model||S.model;S.sysPrompt=d.sysPrompt||S.sysPrompt;save();renderConvs();renderMsgs();toast('✅ 导入成功：'+d.convs.length+'个会话')}else{const conv={id:gi(),title:'导入会话',msgs:[],sp:S.sysPrompt};if(d.msgs&&Array.isArray(d.msgs))conv.msgs=d.msgs;else if(d.messages&&Array.isArray(d.messages))conv.msgs=d.messages;else throw 0;S.convs.unshift(conv);S.cid=conv.id;save();renderConvs();renderMsgs();toast('✅ 导入成功')}}catch(e){toast('❌ 文件格式无效')}};rd.readAsText(f);fip.value=''}}
setInterval(checkScroll,500);
setTimeout(function(){try{checkUpdate(true)}catch(e){}},3000);
}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
